<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OSINT Tool - VirusTotal Checker</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f4;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #333;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        textarea, input[type="text"] {
            width: 100%;
            padding: 10px;
            margin-bottom: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #218838;
        }
        .result {
            margin-top: 20px;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .result h3 {
            margin-top: 0;
            color: #007bff;
        }
        .error {
            color: red;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>OSINT Tool - VirusTotal URL/IP Checker</h1>
        <form id="checkForm">
            <label for="apiKey">VirusTotal API Key:</label>
            <input type="text" id="apiKey" placeholder="Enter your VirusTotal API key" required>

            <label for="inputs">Enter URLs or IPs (one per line):</label>
            <textarea id="inputs" rows="10" placeholder="https://example.com&#10;192.168.1.1&#10;anotherurl.com" required></textarea>

            <button type="submit">Check</button>
        </form>
        <div id="results"></div>
    </div>

    <script>
        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const apiKey = document.getElementById('apiKey').value.trim();
            const inputs = document.getElementById('inputs').value.trim().split('\n').filter(line => line.trim() !== '');
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '<p>Checking...</p>';

            if (!apiKey) {
                resultsDiv.innerHTML = '<p class="error">Please enter your API key.</p>';
                return;
            }

            if (inputs.length === 0) {
                resultsDiv.innerHTML = '<p class="error">Please enter at least one URL or IP.</p>';
                return;
            }

            resultsDiv.innerHTML = '';

            for (const input of inputs) {
                const trimmed = input.trim();
                if (!trimmed) continue;
                try {
                    const result = await checkVirusTotal(trimmed, apiKey);
                    displayResult(trimmed, result);
                } catch (error) {
                    displayResult(trimmed, { error: error.message });
                }
            }
        });

        async function checkVirusTotal(input, apiKey) {
            const isIP = /^(\d{1,3}\.){3}\d{1,3}$/.test(input);
            let url, method = 'GET', body = null;

            if (isIP) {
                url = `https://www.virustotal.com/api/v3/ip_addresses/${encodeURIComponent(input)}`;
            } else {
                // For URLs, first submit to get ID
                const submitUrl = 'https://www.virustotal.com/api/v3/urls';
                const submitResponse = await fetch(submitUrl, {
                    method: 'POST',
                    headers: {
                        'x-apikey': apiKey,
                        'Content-Type': 'application/x-www-form-urlencoded'
                    },
                    body: `url=${encodeURIComponent(input)}`
                });
                if (!submitResponse.ok) {
                    throw new Error(`Submit failed: ${submitResponse.status}`);
                }
                const submitData = await submitResponse.json();
                const id = submitData.data.id;
                url = `https://www.virustotal.com/api/v3/urls/${id}`;
            }

            const response = await fetch(url, {
                method: method,
                headers: {
                    'x-apikey': apiKey
                },
                body: body
            });

            if (!response.ok) {
                throw new Error(`API request failed: ${response.status} ${response.statusText}`);
            }

            const data = await response.json();
            return parseResult(data, isIP);
        }

        function parseResult(data, isIP) {
            const attributes = data.data.attributes;
            const stats = attributes.last_analysis_stats;
            const total = stats.harmless + stats.malicious + stats.suspicious + stats.timeout + stats.undetected;
            const score = total > 0 ? `${stats.malicious}/${total}` : '0/0';
            const isMalicious = stats.malicious > 0;

            let communityScore = 'N/A';
            if (attributes.total_votes) {
                communityScore = `${attributes.total_votes.harmless}/${attributes.total_votes.malicious}`;
            }

            let origin = 'N/A', location = 'N/A', details = 'N/A';

            if (isIP) {
                if (attributes.whois) {
                    origin = attributes.whois || 'N/A';
                }
                if (attributes.country) {
                    location = attributes.country;
                }
                details = attributes.as_owner || 'N/A';
            } else {
                // For URLs, perhaps domain info
                const url = attributes.url;
                // You might need to resolve domain, but for now, just URL...
                origin = url;
                location = 'N/A'; // Would need additional API
                details = attributes.title || 'N/A';
            }

            return {
                virusTotalScore: score,
                communityScore: communityScore,
                isMalicious: isMalicious ? 'Yes' : 'No',
                origin: origin,
                location: location,
                details: details
            };
        }

        function displayResult(input, result) {
            const resultsDiv = document.getElementById('results');
            const div = document.createElement('div');
            div.className = 'result';
            if (result.error) {
                div.innerHTML = `<h3>${input}</h3><p class="error">Error: ${result.error}</p>`;
            } else {
                div.innerHTML = `
                    <h3>${input}</h3>
                    <p><strong>VirusTotal Score:</strong> ${result.virusTotalScore}</p>
                    <p><strong>Community Score:</strong> ${result.communityScore}</p>
                    <p><strong>Is Malicious:</strong> ${result.isMalicious}</p>
                    <p><strong>Origin:</strong> ${result.origin}</p>
                    <p><strong>Location:</strong> ${result.location}</p>
                    <p><strong>Details:</strong> ${result.details}</p>
                `;
            }
            resultsDiv.appendChild(div);
        }
    </script>
</body>
</html>
